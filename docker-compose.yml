version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edutrack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-edutrack_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edutrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edutrack_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  emqx:
    image: emqx/emqx:5.6.0
    container_name: edutrack_emqx
    restart: always
    ports:
      - "1883:1883"     # MQTT Port for ESP32
      - "8083:8083"     # MQTT over WebSocket
      - "18083:18083"   # Dashboard (admin/public)
    volumes:
      - emqxdata:/opt/emqx/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edutrack_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  emqxdata:
